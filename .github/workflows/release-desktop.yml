name: Release desktop (macOS)

# Builds and publishes the macOS DMG + update artifacts to a GitHub Release.
# - Tag push (`v*.*.*`) → full Developer ID signed + notarized release.
# - Manual run (workflow_dispatch) → optionally `adhoc` mode, which ad-hoc signs
#   and SKIPS notarization (useful when Apple's notary service is backed up).
#
# Required repository secrets for a signed build (see docs/PACKAGING.md):
#   CSC_LINK                     base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD             password for that .p12
#   APPLE_ID                     Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
#   APPLE_TEAM_ID                10-char Apple Developer Team ID
# Optional (telemetry):
#   MAIN_VITE_POSTHOG_API_KEY    PostHog project key baked into host.js at build time;
#                                absent → analytics no-op (PostHog is tree-shaken out).
# GITHUB_TOKEN (provided automatically) is used by electron-builder to upload.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      adhoc:
        description: "Ad-hoc sign (skip Developer ID signing + notarization)"
        type: boolean
        default: false

permissions:
  contents: write # create/edit the GitHub Release

jobs:
  build:
    runs-on: macos-14 # Apple Silicon runner (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild native modules for the Electron ABI
        run: bun run --cwd app rebuild

      # electron-builder uploads assets into a DRAFT release. If a *published*
      # (non-draft) release for this tag already exists — e.g. the tag was created
      # via GitHub's "Publish release" UI or `gh release create` instead of a plain
      # `git push` of the tag — electron-builder refuses to write into it and
      # SILENTLY SKIPS every asset (dmg, zip, latest-mac.yml). The release then
      # shows up as "Latest" with no binaries and auto-update 404s for all users.
      #
      # This preflight converts such a release back to a draft so the upload below
      # succeeds; the maintainer re-publishes after CI. To avoid UN-publishing a
      # healthy live release on an accidental re-run, it acts ONLY when the release is
      # both published AND missing its `latest-mac.yml` feed (i.e. actually broken).
      # A published release that already has the feed is left alone and the step fails
      # loudly, so a real re-run doesn't silently regress the update feed.
      - name: Ensure release is a draft (so asset upload isn't skipped)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `gh release view` exits non-zero if the release doesn't exist yet (the
          # normal path). Capture it explicitly so a gh/network failure isn't confused
          # with "no release".
          if ! meta=$(gh release view "$TAG" --json isDraft,assets 2>err.txt); then
            if grep -qi "release not found" err.txt; then
              echo "No release for $TAG yet — electron-builder will create the draft."
              exit 0
            fi
            echo "::error::gh release view failed for $TAG"; cat err.txt; exit 1
          fi
          is_draft=$(jq -r '.isDraft' <<<"$meta")
          has_feed=$(jq -r '[.assets[].name] | any(. == "latest-mac.yml")' <<<"$meta")
          if [ "$is_draft" = "true" ]; then
            echo "Release $TAG is already a draft — nothing to do."
          elif [ "$has_feed" = "false" ]; then
            echo "::warning::Published release $TAG is missing latest-mac.yml — converting to draft so electron-builder can upload assets. Re-publish it after this run."
            gh release edit "$TAG" --draft
          else
            echo "::error::Published release $TAG already has latest-mac.yml. Refusing to draft a healthy release. If you intend to re-release, delete or draft it manually first."
            exit 1
          fi

      - name: Build, sign & publish
        env:
          ADHOC: ${{ inputs.adhoc }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into host.js by electron-vite; absent → analytics no-op.
          MAIN_VITE_POSTHOG_API_KEY: ${{ secrets.MAIN_VITE_POSTHOG_API_KEY }}
        # `package` runs the prepackage native-module materialization + electron-vite
        # build + electron-builder. `--publish always` uploads the DMG, the zip, and
        # latest-mac.yml (the electron-updater feed) to the GitHub Release.
        run: |
          # Ad-hoc when explicitly requested OR when no signing cert is configured
          # (so a tag push still produces a usable release before signing secrets
          # are set / while Apple's notary is unavailable).
          if [ "$ADHOC" = "true" ] || [ -z "$CSC_LINK" ]; then
            echo "::warning::Ad-hoc build — skipping Developer ID signing + notarization."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          bun run --cwd app package -- --publish always

      # Publish the renderer + daemon sourcemaps as a GitHub Release asset so any
      # released version's sanitized `app_error` stack frames (bundle.js:line — see
      # app/src/shared/analytics.ts) resolve back to source during triage:
      #   gh release download <tag> -p 'sourcemaps-*.zip'
      # These are PUBLIC (public repo), which is fine here: they only reconstruct
      # already-public source (all of app/src is on the open remote) and carry no secret
      # the shipped app binary doesn't already contain — the sole baked-in build value is
      # the public PostHog ingestion key. Emitted as "hidden" (electron.vite.config.ts)
      # and excluded from the app bundle (electron-builder.yml `!out/**/*.map`), so they
      # reach users only as this explicit, durable release asset — never inside the app.
      # Tag pushes only: electron-builder created the draft release in the step above
      # (the maintainer re-publishes it after CI), and `gh release upload` attaches to it.
      - name: Publish sourcemaps to the GitHub Release (for error triage)
        if: ${{ startsWith(github.ref, 'refs/tags/') && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$(find app/out -name '*.js.map' -print -quit)" ]; then
            echo "::warning::no sourcemaps found to publish"; exit 0
          fi
          # Preserve the out/ layout in the zip so renderer vs daemon maps stay distinct.
          find app/out -name '*.js.map' -print0 | xargs -0 zip -q "sourcemaps-$TAG.zip"
          gh release upload "$TAG" "sourcemaps-$TAG.zip" --clobber
